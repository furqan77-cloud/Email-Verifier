<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Email Verifier</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #0f172a; 
      color: #f8fafc; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
    }
    .card { 
      background: #1e293b; 
      padding: 2rem; 
      border-radius: 12px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
      width: 100%; 
      max-width: 420px; 
    }
    h2 { 
      margin-top: 0; 
      text-align: center; 
      color: #38bdf8; 
    }
    .input-group { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 1.5rem; 
    }
    input[type="email"] { 
      flex: 1; 
      padding: 0.75rem; 
      border-radius: 6px; 
      border: 1px solid #334155; 
      background: #0f172a; 
      color: #fff; 
      font-size: 1rem; 
    }
    button { 
      padding: 0.75rem 1.25rem; 
      background: #0284c7; 
      color: white; 
      border: none; 
      border-radius: 6px; 
      font-weight: bold; 
      cursor: pointer; 
    }
    button:hover { 
      background: #0369a1; 
    }
    .result { 
      display: none; 
      background: #0f172a; 
      padding: 1rem; 
      border-radius: 8px; 
      border: 1px solid #334155; 
    }
    .status { 
      font-size: 1.25rem; 
      font-weight: bold; 
      text-align: center; 
      margin-bottom: 0.75rem; 
      padding: 0.5rem;
      border-radius: 6px;
    }
    /* Dynamic Colors */
    .status-valid { 
      color: #22c55e; 
      background: rgba(34, 197, 94, 0.1); 
      border: 1px solid #22c55e; 
    }
    .status-risky { 
      color: #eab308; 
      background: rgba(234, 179, 8, 0.1); 
      border: 1px solid #eab308; 
    }
    .status-invalid { 
      color: #ef4444; 
      background: rgba(239, 68, 68, 0.1); 
      border: 1px solid #ef4444; 
    }
    .row { 
      display: flex; 
      justify-content: space-between; 
      padding: 0.4rem 0; 
      font-size: 0.9rem; 
      border-bottom: 1px solid #1e293b; 
    }
    .row span:last-child {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Email Verifier</h2>
    <div class="input-group">
      <input type="email" id="emailInput" placeholder="Enter email to check..." required>
      <button onclick="checkEmail()" id="btn">Verify</button>
    </div>
    
    <div id="resultBox" class="result">
      <div id="statusHeader" class="status"></div>
      
      <div class="row">
        <span>Verifier Engine:</span>
        <span style="color: #38bdf8;">Abstract API</span>
      </div>
      <div class="row">
        <span>Syntax Valid:</span>
        <span id="resSyntax"></span>
      </div>
      <div class="row">
        <span>Disposable Email:</span>
        <span id="resDisposable"></span>
      </div>
      <div class="row">
        <span>MX Records Found:</span>
        <span id="resMX"></span>
      </div>
      <div class="row">
        <span>Quality Score:</span>
        <span id="resScore"></span>
      </div>
    </div>
  </div>

  <script>
    async function checkEmail() {
      const email = document.getElementById('emailInput').value.trim();
      const btn = document.getElementById('btn');
      const box = document.getElementById('resultBox');
      const statusHeader = document.getElementById('statusHeader');
      
      if (!email) return alert('Please enter an email address');
      
      btn.innerText = 'Checking...';
      btn.disabled = true;
      box.style.display = 'none';

      try {
        const res = await fetch(`/api/verify?email=${encodeURIComponent(email)}`);
        const data = await res.json();
        
        if (data.error) {
          alert('Error: ' + data.error);
        } else {
          // Color Logic
          const status = data.overall_status.toLowerCase();
          
          if (status === 'valid') {
            statusHeader.innerText = '✓ VERIFIED EMAIL';
            statusHeader.className = 'status status-valid';
          } else if (status === 'risky') {
            statusHeader.innerText = '⚠ RISKY EMAIL';
            statusHeader.className = 'status status-risky';
          } else {
            statusHeader.innerText = '✕ WRONG / INVALID EMAIL';
            statusHeader.className = 'status status-invalid';
          }

          // Populate Details
          document.getElementById('resSyntax').innerText = data.valid_syntax ? 'Yes' : 'No';
          document.getElementById('resDisposable').innerText = data.is_disposable ? 'Yes' : 'No';
          document.getElementById('resMX').innerText = data.has_mx_records ? 'Yes' : 'No';
          document.getElementById('resScore').innerText = `${Math.round(data.quality_score * 100)}%`;
          
          box.style.display = 'block';
        }
      } catch (err) {
        alert('Failed to connect to the verification API.');
      } finally {
        btn.innerText = 'Verify';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
